spring.application.name=cloudChat
spring.data.web.pageable.max-page-size=100
# View mapping happens inside service transactions; keeping OSIV off fails fast on any
# lazy access that escapes a transaction instead of silently holding connections per request.
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

app.storage.type=${STORAGE_TYPE:local}
app.storage.root=${user.home}/cloudchat-uploads

app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}

# Security
# Leave JWT_SECRET empty in development: an ephemeral key is generated at startup.
# In production set JWT_SECRET to a base64 value decoding to at least 32 bytes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=PT12H
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
